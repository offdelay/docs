<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="552" height="336">
  <defs>
    <!-- Material Design Icons (24x24) - Licensed under Apache 2.0 -->
    <g id="mdi-chevron-left">
      <path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z" />
    </g>
    <g id="mdi-thermometer">
      <path d="M15 13V5A3 3 0 0 0 9 5V13A5 5 0 1 0 15 13M12 4A1 1 0 0 1 13 5V8H11V5A1 1 0 0 1 12 4Z" />
    </g>
    <g id="mdi-cog-outline">
      <path d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,10A2,2 0 0,0 10,12A2,2 0 0,0 12,14A2,2 0 0,0 14,12A2,2 0 0,0 12,10M10,22C9.75,22 9.54,21.82 9.5,21.58L9.13,18.93C8.5,18.68 7.96,18.34 7.44,17.94L4.95,18.95C4.73,19.03 4.46,18.95 4.34,18.73L2.34,15.27C2.21,15.05 2.27,14.78 2.46,14.63L4.57,12.97L4.5,12L4.57,11L2.46,9.37C2.27,9.22 2.21,8.95 2.34,8.73L4.34,5.27C4.46,5.05 4.73,4.96 4.95,5.05L7.44,6.05C7.96,5.66 8.5,5.32 9.13,5.07L9.5,2.42C9.54,2.18 9.75,2 10,2H14C14.25,2 14.46,2.18 14.5,2.42L14.87,5.07C15.5,5.32 16.04,5.66 16.56,6.05L19.05,5.05C19.27,4.96 19.54,5.05 19.66,5.27L21.66,8.73C21.79,8.95 21.73,9.22 21.54,9.37L19.43,11L19.5,12L19.43,13L21.54,14.63C21.73,14.78 21.79,15.05 21.66,15.27L19.66,18.73C19.54,18.95 19.27,19.04 19.05,18.95L16.56,17.95C16.04,18.34 15.5,18.68 14.87,18.93L14.5,21.58C14.46,21.82 14.25,22 14,22H10M11.25,4L10.88,6.61C9.68,6.86 8.62,7.5 7.85,8.39L5.44,7.35L4.69,8.65L6.8,10.2C6.4,11.37 6.4,12.64 6.8,13.8L4.68,15.36L5.43,16.66L7.86,15.62C8.63,16.5 9.68,17.14 10.87,17.38L11.24,20H12.76L13.13,17.39C14.32,17.14 15.37,16.5 16.14,15.62L18.57,16.66L19.32,15.36L17.2,13.81C17.6,12.64 17.6,11.37 17.2,10.2L19.31,8.65L18.56,7.35L16.15,8.39C15.38,7.5 14.32,6.86 13.12,6.62L12.75,4H11.25Z" />
    </g>
    <g id="mdi-palette">
      <path d="M17.5,12A1.5,1.5 0 0,1 16,10.5A1.5,1.5 0 0,1 17.5,9A1.5,1.5 0 0,1 19,10.5A1.5,1.5 0 0,1 17.5,12M14.5,8A1.5,1.5 0 0,1 13,6.5A1.5,1.5 0 0,1 14.5,5A1.5,1.5 0 0,1 16,6.5A1.5,1.5 0 0,1 14.5,8M9.5,8A1.5,1.5 0 0,1 8,6.5A1.5,1.5 0 0,1 9.5,5A1.5,1.5 0 0,1 11,6.5A1.5,1.5 0 0,1 9.5,8M6.5,12A1.5,1.5 0 0,1 5,10.5A1.5,1.5 0 0,1 6.5,9A1.5,1.5 0 0,1 8,10.5A1.5,1.5 0 0,1 6.5,12M12,3A9,9 0 0,0 3,12A9,9 0 0,0 12,21A1.5,1.5 0 0,0 13.5,19.5C13.5,19.11 13.35,18.76 13.11,18.5C12.88,18.23 12.73,17.88 12.73,17.5A1.5,1.5 0 0,1 14.23,16H16A5,5 0 0,0 21,11C21,6.58 16.97,3 12,3Z" />
    </g>
    <g id="mdi-lightbulb">
      <path d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z" />
    </g>
  </defs>

  <!-- ==================== 0. MAIN CANVAS BACKGROUND ==================== -->
  <rect x="0" y="0" width="920" height="560" rx="18" fill="#111215" />

  <!-- ==================== 1. TOP CHIPS HEADER BAR ==================== -->
  <g id="top-header-bar" transform="translate(0, 14)">
    <!-- Back Button (<) -->
    <circle cx="52" cy="34" r="28" fill="#212328" stroke="#2c2e33" stroke-width="1" />
    <use href="#mdi-chevron-left" transform="translate(38, 20) scale(1.15)" fill="#e2e4e9" />

    <!-- Living Room Pill -->
    <rect x="310" y="6" width="142" height="56" rx="28" fill="#212328" stroke="#2c2e33" stroke-width="1" />
    <text x="381" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f1f3f5">Living room</text>

    <!-- Temperature Pill (20.0 °C) -->
    <rect x="466" y="6" width="138" height="56" rx="28" fill="#212328" stroke="#2c2e33" stroke-width="1" />
    <use href="#mdi-thermometer" transform="translate(480, 19) scale(1.2)" fill="#f1f3f5" />
    <text x="546" y="40" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f1f3f5">20.0 °C</text>

    <!-- Settings Cogwheel Button -->
    <circle cx="866" cy="34" r="28" fill="#212328" stroke="#2c2e33" stroke-width="1" />
    <use href="#mdi-cog-outline" transform="translate(852, 20) scale(1.15)" fill="#e2e4e9" />
  </g>

  <!-- ==================== 2. SECTION TITLE ==================== -->
  <text x="42" y="156" font-family="sans-serif" font-size="25" font-weight="normal" fill="#a2a6b0">Devices</text>

  <!-- ==================== 3. SCENES ROW (4 CARDS) ==================== -->
  <g id="scenes-row" transform="translate(22, 192)">
    <!-- Scene 1: Default -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="204" height="142" rx="26" fill="#212328" />
      <circle cx="102" cy="50" r="28" fill="#32353b" />
      <use href="#mdi-palette" transform="translate(86, 34) scale(1.3)" fill="#8e929b" />
      <text x="102" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb">Default</text>
    </g>

    <!-- Scene 2: Off -->
    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="204" height="142" rx="26" fill="#212328" />
      <circle cx="102" cy="50" r="28" fill="#32353b" />
      <use href="#mdi-palette" transform="translate(86, 34) scale(1.3)" fill="#8e929b" />
      <text x="102" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb">Off</text>
    </g>

    <!-- Scene 3: Bright -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="204" height="142" rx="26" fill="#212328" />
      <circle cx="102" cy="50" r="28" fill="#32353b" />
      <use href="#mdi-palette" transform="translate(86, 34) scale(1.3)" fill="#8e929b" />
      <text x="102" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb">Bright</text>
    </g>

    <!-- Scene 4: Dim -->
    <g transform="translate(672, 0)">
      <rect x="0" y="0" width="204" height="142" rx="26" fill="#212328" />
      <circle cx="102" cy="50" r="28" fill="#32353b" />
      <use href="#mdi-palette" transform="translate(86, 34) scale(1.3)" fill="#8e929b" />
      <text x="102" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e5e7eb">Dim</text>
    </g>
  </g>

  <!-- ==================== 4. CEILING LIGHT CARD ==================== -->
  <g id="ceiling-light-card" transform="translate(22, 354)">
    <!-- Outer Card Surface -->
    <rect x="0" y="0" width="876" height="184" rx="26" fill="#212328" />

    <!-- Lightbulb Icon Circle -->
    <circle cx="50" cy="52" r="30" fill="#46382b" />
    <use href="#mdi-lightbulb" transform="translate(33, 35) scale(1.4)" fill="#ebb06b" />

    <!-- Title & Percentage -->
    <text x="98" y="45" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f1f3f5">Ceiling light</text>
    <text x="98" y="75" font-family="sans-serif" font-size="20" fill="#d1d5db">80%</text>

    <!-- Brightness Slider Track (Unfilled Brown Background) -->
    <rect x="20" y="96" width="744" height="68" rx="18" fill="#46382b" />

    <!-- Brightness Slider Active Fill (80% Warm Amber) -->
    <path d="M 38 96 L 614 96 L 614 164 L 38 164 Q 20 164 20 146 L 20 114 Q 20 96 38 96 Z" fill="#ebb06b" />

    <!-- Color Temperature Toggle Button (Right) -->
    <rect x="786" y="96" width="70" height="68" rx="18" fill="#2b2e34" />
    <use href="#mdi-thermometer" transform="translate(804, 113) scale(1.4)" fill="#f1f3f5" />
  </g>

  <!-- ==================== 5. GREEN CALLOUT BOXES & LABELS (FONT-SIZE 20) ==================== -->
  <!-- Callout 1: Scenes -->
  <g id="scenes-callout">
    <!-- Attached "Scenes" Label Pill (Top-Right of Scenes Box) -->
    <rect x="766" y="148" width="124" height="32" rx="8" fill="#188050" />
    <text x="828" y="171" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Scenes</text>

    <!-- Rounded Green Callout Border Around the 4 Scene Cards -->
    <rect x="14" y="180" width="892" height="164" rx="16" ry="16" fill="none" stroke="#188050" stroke-width="3.5" />
  </g>

  <!-- Callout 2: Light -->
  <g id="light-callout">
    <!-- Attached "Light" Label Pill (Top-Right of Light Card) -->
    <rect x="780" y="354" width="110" height="32" rx="8" fill="#188050" />
    <text x="835" y="377" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Light</text>

    <!-- Rounded Green Callout Border Around the Ceiling Light Card -->
    <rect x="14" y="348" width="892" height="198" rx="16" ry="16" fill="none" stroke="#188050" stroke-width="3.5" />
  </g>
</svg>
