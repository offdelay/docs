<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title description">
  <title id="title">Master bedroom settings wireframe</title>
  <desc id="description">A room settings panel for the Master bedroom with heater enable and heater schedule options.</desc>
  <rect x="1" y="1" width="758" height="518" rx="24" fill="#17191e" stroke="#42454d" stroke-width="2"/>
  <rect x="20" y="18" width="720" height="76" rx="18" fill="#202228"/>
  <circle cx="64" cy="56" r="25" fill="#292c33"/>
  <text x="64" y="64" text-anchor="middle" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="23">▰</text>
  <text x="110" y="54" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18" font-weight="700">Master bedroom settings</text>
  <text x="110" y="75" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Options for this room</text>
  <text x="704" y="65" text-anchor="middle" fill="#c4c6cc" font-family="Arial, sans-serif" font-size="24">×</text>

  <text x="48" y="145" fill="#aeb1b9" font-family="Arial, sans-serif" font-size="19">Heater</text>
  <line x1="48" y1="161" x2="712" y2="161" stroke="#34363d" stroke-width="2"/>

  <circle cx="72" cy="221" r="25" fill="#293d5d"/>
  <text x="72" y="229" text-anchor="middle" fill="#78a8e8" font-family="Arial, sans-serif" font-size="22">⚙</text>
  <text x="116" y="217" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="17" font-weight="700">Heater Enabled</text>
  <text x="116" y="242" fill="#c4c6cc" font-family="Arial, sans-serif" font-size="15">On</text>
  <rect x="648" y="204" width="54" height="30" rx="15" fill="#4a8f48"/>
  <circle cx="686" cy="219" r="11" fill="#ffffff"/>

  <line x1="48" y1="272" x2="712" y2="272" stroke="#303238"/>
  <circle cx="72" cy="329" r="25" fill="#303238"/>
  <text x="72" y="337" text-anchor="middle" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="22">◷</text>
  <text x="116" y="325" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="17" font-weight="700">Heater Schedule</text>
  <text x="116" y="350" fill="#c4c6cc" font-family="Arial, sans-serif" font-size="15">Off</text>
  <rect x="648" y="312" width="54" height="30" rx="15" fill="#45474e"/>
  <circle cx="663" cy="327" r="11" fill="#d1d5db"/>

  <rect x="48" y="400" width="664" height="74" rx="16" fill="#202228"/>
  <text x="72" y="430" fill="#c4c6cc" font-family="Arial, sans-serif" font-size="14">Room settings affect devices and behavior in this room.</text>
  <text x="72" y="452" fill="#8f939d" font-family="Arial, sans-serif" font-size="13">Available options depend on your Home Assistant setup.</text>
</svg>
