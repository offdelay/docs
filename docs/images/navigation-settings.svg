<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title description">
  <title id="title">Home Assistant Settings wireframe</title>
  <desc id="description">Settings categories with Devices and services and Automations and scenes highlighted.</desc>
  <rect x="1" y="1" width="758" height="718" rx="20" fill="#111318" stroke="#42454d" stroke-width="2"/>
  <text x="32" y="48" fill="#c6c8ce" font-family="Arial, sans-serif" font-size="21">Settings</text>
  <line x1="0" y1="66" x2="760" y2="66" stroke="#34363d" stroke-width="2"/>

  <rect x="62" y="88" width="636" height="376" rx="24" fill="#25272d"/>
  <rect x="78" y="148" width="604" height="70" rx="12" fill="none" stroke="#f4c542" stroke-width="3"/>
  <circle cx="112" cy="183" r="20" fill="#1856bd"/>
  <text x="112" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">▣</text>
  <text x="150" y="176" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16" font-weight="700">Devices &amp; services</text>
  <text x="150" y="198" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Integrations, devices, entities, and helpers</text>
  <text x="654" y="190" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>

  <rect x="78" y="222" width="604" height="70" rx="12" fill="none" stroke="#f4c542" stroke-width="3"/>
  <circle cx="112" cy="257" r="20" fill="#4a8f48"/>
  <text x="112" y="264" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">⚙</text>
  <text x="150" y="250" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16" font-weight="700">Automations &amp; scenes</text>
  <text x="150" y="272" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Automations, scenes, scripts, and blueprints</text>
  <text x="654" y="264" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>

  <circle cx="112" cy="327" r="20" fill="#dc812b"/>
  <text x="112" y="334" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19">⌂</text>
  <text x="150" y="321" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16">Areas, labels &amp; zones</text>
  <text x="150" y="343" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Manage locations in and around your house</text>
  <text x="654" y="335" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>

  <circle cx="112" cy="397" r="20" fill="#e2be3e"/>
  <text x="112" y="404" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19">✚</text>
  <text x="150" y="391" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16">Apps</text>
  <text x="150" y="413" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Run extra applications next to Home Assistant</text>
  <text x="654" y="405" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>

  <rect x="62" y="482" width="636" height="118" rx="24" fill="#25272d"/>
  <circle cx="112" cy="523" r="20" fill="#098e99"/>
  <text x="112" y="530" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">⌁</text>
  <text x="150" y="517" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16">Connectivity</text>
  <text x="150" y="539" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="13">Communication protocols and radios for your devices</text>
  <text x="654" y="531" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>
  <circle cx="112" cy="566" r="20" fill="#3269c9"/>
  <text x="112" y="573" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">♩</text>
  <text x="150" y="572" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16">Voice assistants</text>
  <text x="654" y="575" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>

  <rect x="62" y="618" width="636" height="78" rx="24" fill="#25272d"/>
  <circle cx="112" cy="657" r="20" fill="#4b5560"/>
  <text x="112" y="664" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">i</text>
  <text x="150" y="663" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="16">About</text>
  <text x="654" y="665" text-anchor="middle" fill="#9ca0aa" font-family="Arial, sans-serif" font-size="25">›</text>
</svg>
